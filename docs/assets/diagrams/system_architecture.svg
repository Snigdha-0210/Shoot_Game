<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00aa55" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ba133b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #ffffff; letter-spacing: 2px; }
    .subtitle-text { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #00f0ff; letter-spacing: 1.5px; }
    .node-title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #ffffff; }
    .node-sub { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', monospace; font-weight: 700; font-size: 10px; fill: #00f0ff; letter-spacing: 0.5px; }
    .tag-text { font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 10.5px; fill: #e2e8f0; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="780" fill="url(#bgGrad)" />

  <!-- Grid Overlay Pattern -->
  <g opacity="0.06">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200 M0,360 H1200 M0,420 H1200 M0,480 H1200 M0,540 H1200 M0,600 H1200 M0,660 H1200 M0,720 H1200" stroke="#00f0ff" stroke-width="1" />
    <path d="M60,0 V780 M120,0 V780 M180,0 V780 M240,0 V780 M300,0 V780 M360,0 V780 M420,0 V780 M480,0 V780 M540,0 V780 M600,0 V780 M660,0 V780 M720,0 V780 M780,0 V780 M840,0 V780 M900,0 V780 M960,0 V780 M1020,0 V780 M1080,0 V780 M1140,0 V780" stroke="#00f0ff" stroke-width="1" />
  </g>

  <!-- Header Banner -->
  <rect x="40" y="30" width="1120" height="70" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#boxShadow)" />
  <circle cx="75" cy="65" r="18" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="2" />
  <text x="75" y="71" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="18" fill="#00f0ff">⚡</text>
  <text x="110" y="58" class="title-text">OPERATION: DEFUSE — SYSTEM ARCHITECTURE</text>
  <text x="110" y="78" class="subtitle-text">FULL-STACK REAL-TIME 3D TACTICAL ARCADE &amp; BREADBOARD SIMULATION ENGINE</text>

  <!-- Central Orchestrator: main.js -->
  <g filter="url(#boxShadow)">
    <rect x="440" y="130" width="320" height="110" rx="10" fill="#0f172a" stroke="#00f0ff" stroke-width="2" />
    <rect x="450" y="140" width="90" height="20" rx="4" fill="#00f0ff" fill-opacity="0.2" />
    <text x="495" y="154" text-anchor="middle" class="badge-text">CORE MASTER</text>
    <text x="455" y="180" class="node-title">main.js (Tactical Coordinator)</text>
    <text x="455" y="200" class="node-sub">• Global 120s Detonation Clock</text>
    <text x="455" y="218" class="node-sub">• FSM States: MENU | PLAYING | DEFUSING | VICTORY</text>
    <circle cx="735" cy="155" r="7" fill="#00ff88" filter="url(#glowCyan)" />
  </g>

  <!-- Connection Lines from Master -->
  <!-- Left Side Connections -->
  <path d="M440,165 H250 V280" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />
  <path d="M440,195 H250 V430" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />
  <path d="M440,225 H250 V580" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />

  <!-- Center Connection -->
  <path d="M600,240 V300" fill="none" stroke="#ffd700" stroke-width="2.5" />
  <path d="M600,410 V460" fill="none" stroke="#ffd700" stroke-width="2.5" />

  <!-- Right Side Connections -->
  <path d="M760,165 H950 V280" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />
  <path d="M760,195 H950 V430" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />
  <path d="M760,225 H950 V580" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />

  <!-- COLUMN 1: ENGINE LAYER (Left Column) -->
  <!-- Box 1.1: WebGL Renderer -->
  <g filter="url(#boxShadow)">
    <rect x="70" y="280" width="310" height="115" rx="8" fill="#131b2e" stroke="#334155" stroke-width="1.5" />
    <rect x="80" y="290" width="95" height="18" rx="4" fill="#38bdf8" fill-opacity="0.2" />
    <text x="127" y="303" text-anchor="middle" class="badge-text" fill="#38bdf8">3D GRAPHICS</text>
    <text x="85" y="328" class="node-title">GameRenderer (Renderer.js)</text>
    <text x="85" y="348" class="node-sub">• Three.js r170 WebGL Render Pipeline</text>
    <text x="85" y="365" class="node-sub">• Directional Moonlight, Soft Shadows &amp; Fog</text>
    <text x="85" y="382" class="node-sub">• Muzzle Flares, Sparks &amp; Laser Beams</text>
  </g>

  <!-- Box 1.2: Procedural Audio Engine -->
  <g filter="url(#boxShadow)">
    <rect x="70" y="430" width="310" height="115" rx="8" fill="#131b2e" stroke="#334155" stroke-width="1.5" />
    <rect x="80" y="440" width="105" height="18" rx="4" fill="#f43f5e" fill-opacity="0.2" />
    <text x="132" y="453" text-anchor="middle" class="badge-text" fill="#f43f5e">AUDIO SYNTH</text>
    <text x="85" y="478" class="node-title">AudioEngine (Audio.js)</text>
    <text x="85" y="498" class="node-sub">• 100% Procedural Web Audio API</text>
    <text x="85" y="515" class="node-sub">• M4A1 Suppressed Crack &amp; Shell Casings</text>
    <text x="85" y="532" class="node-sub">• Heartbeat Slow-Mo Dilation &amp; Sirens</text>
  </g>

  <!-- Box 1.3: Procedural Textures -->
  <g filter="url(#boxShadow)">
    <rect x="70" y="580" width="310" height="115" rx="8" fill="#131b2e" stroke="#334155" stroke-width="1.5" />
    <rect x="80" y="590" width="95" height="18" rx="4" fill="#a855f7" fill-opacity="0.2" />
    <text x="127" y="603" text-anchor="middle" class="badge-text" fill="#a855f7">TEXTURES</text>
    <text x="85" y="628" class="node-title">TextureGenerator.js</text>
    <text x="85" y="648" class="node-sub">• Dynamic HTML5 2D Canvas Generation</text>
    <text x="85" y="665" class="node-sub">• Wet Cobblestone, Brick Facades, Metal Grates</text>
    <text x="85" y="682" class="node-sub">• Zero External Image Asset Dependencies</text>
  </g>

  <!-- COLUMN 2: RAIL & DEFUSAL SYSTEMS (Center Column) -->
  <!-- Box 2.1: Rail Controller & QTE -->
  <g filter="url(#boxShadow)">
    <rect x="420" y="295" width="360" height="120" rx="10" fill="#131b2e" stroke="#ffd700" stroke-width="2" />
    <rect x="430" y="305" width="135" height="18" rx="4" fill="#ffd700" fill-opacity="0.2" />
    <text x="497" y="318" text-anchor="middle" class="badge-text" fill="#ffd700">ARCADE MECHANICS</text>
    <text x="435" y="343" class="node-title">RailController.js (Automated Rail)</text>
    <text x="435" y="363" class="node-sub">• High-Speed Corridor Sprinting (6.5 to 12.0 m/s)</text>
    <text x="435" y="380" class="node-sub">• Auto-Aim Target Lock &amp; Quick-Draw Windows</text>
    <text x="435" y="397" class="node-sub">• 3-Button Cipher Engine: [C] [V] [SPACE]</text>
  </g>

  <!-- Box 2.2: Interactive Breadboard Defusal Station -->
  <g filter="url(#boxShadow)">
    <rect x="420" y="460" width="360" height="135" rx="10" fill="#131b2e" stroke="#00ff88" stroke-width="2" />
    <rect x="430" y="470" width="130" height="18" rx="4" fill="#00ff88" fill-opacity="0.2" />
    <text x="495" y="483" text-anchor="middle" class="badge-text" fill="#00ff88">BOMB DISARMAMENT</text>
    <text x="435" y="508" class="node-title">DefusalStation.js (6-Wire Mini-Game)</text>
    <text x="435" y="528" class="node-sub">• 6 Breadboard Wires: R, G, Y, K, B, W</text>
    <text x="435" y="545" class="node-sub">• 4-LED Status Bank (Red, Green, Blue, Yellow)</text>
    <text x="435" y="562" class="node-sub">• Multi-Stage Wire Sequence Verification</text>
    <text x="435" y="579" class="node-sub">• 20s Penalty on Fault / Field Manual Rules</text>
  </g>

  <!-- Bottom Hardware controller link -->
  <g filter="url(#boxShadow)">
    <rect x="420" y="625" width="360" height="70" rx="8" fill="#1e1e38" stroke="#6366f1" stroke-width="1.5" />
    <text x="435" y="650" class="node-title" fill="#a5b4fc">Hardware Arcade / Breadboard Interface</text>
    <text x="435" y="672" class="node-sub">• Physical Pinouts for Arcade Cabinets &amp; Microcontrollers</text>
  </g>

  <!-- COLUMN 3: COMBAT & INTERFACE (Right Column) -->
  <!-- Box 3.1: Enemy AI & Archetypes -->
  <g filter="url(#boxShadow)">
    <rect x="820" y="280" width="310" height="115" rx="8" fill="#131b2e" stroke="#334155" stroke-width="1.5" />
    <rect x="830" y="290" width="95" height="18" rx="4" fill="#ef4444" fill-opacity="0.2" />
    <text x="877" y="303" text-anchor="middle" class="badge-text" fill="#ef4444">TACTICAL AI</text>
    <text x="835" y="328" class="node-title">EnemyAI.js &amp; Enemy.js</text>
    <text x="835" y="348" class="node-sub">• 4 Classes: Scout, Juggernaut, Sniper, Boss</text>
    <text x="835" y="365" class="node-sub">• Visible Red Sniper Laser Sight Tracking</text>
    <text x="835" y="382" class="node-sub">• Smoke Cloud Vision Occlusion &amp; Blinding</text>
  </g>

  <!-- Box 3.2: Level Manager -->
  <g filter="url(#boxShadow)">
    <rect x="820" y="430" width="310" height="115" rx="8" fill="#131b2e" stroke="#334155" stroke-width="1.5" />
    <rect x="830" y="440" width="105" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="882" y="453" text-anchor="middle" class="badge-text" fill="#10b981">LEVEL DESIGN</text>
    <text x="835" y="478" class="node-title">LevelManager.js (4 Sectors)</text>
    <text x="835" y="498" class="node-sub">• Sector 1: Coastal Infiltration Yard</text>
    <text x="835" y="515" class="node-sub">• Sector 2: Subterranean Bunker &amp; Servers</text>
    <text x="835" y="532" class="node-sub">• Sector 3: Research Silo &amp; Catwalks</text>
    <text x="835" y="549" class="node-sub">• Sector 4: Fortress Command Citadel</text>
  </g>

  <!-- Box 3.3: Tactical UI & Minimap -->
  <g filter="url(#boxShadow)">
    <rect x="820" y="580" width="310" height="115" rx="8" fill="#131b2e" stroke="#334155" stroke-width="1.5" />
    <rect x="830" y="590" width="95" height="18" rx="4" fill="#06b6d4" fill-opacity="0.2" />
    <text x="877" y="603" text-anchor="middle" class="badge-text" fill="#06b6d4">HUD &amp; RADAR</text>
    <text x="835" y="628" class="node-title">UIController.js &amp; Minimap.js</text>
    <text x="835" y="648" class="node-sub">• Glassmorphism Cyberpunk HUD Overlay</text>
    <text x="835" y="665" class="node-sub">• Forward-Aligned 2D Radar Canvas</text>
    <text x="835" y="682" class="node-sub">• QTE Badges, Boss Health Bar, 3D Waypoints</text>
  </g>

  <!-- Bottom Legend Footer -->
  <g transform="translate(40, 720)">
    <rect width="1120" height="35" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="100" cy="18" r="5" fill="#00f0ff" />
    <text x="115" y="22" class="tag-text">Master Core Loop</text>
    <circle cx="290" cy="18" r="5" fill="#ffd700" />
    <text x="305" y="22" class="tag-text">Arcade Rail Engine</text>
    <circle cx="480" cy="18" r="5" fill="#00ff88" />
    <text x="495" y="22" class="tag-text">Disarmament Logic</text>
    <circle cx="680" cy="18" r="5" fill="#ef4444" />
    <text x="695" y="22" class="tag-text">Tactical AI &amp; Threat Profiles</text>
    <circle cx="920" cy="18" r="5" fill="#a855f7" />
    <text x="935" y="22" class="tag-text">Procedural Web Audio</text>
  </g>
</svg>
